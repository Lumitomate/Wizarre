name: Build and Deploy Web Game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Get Export Templates
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.2.stable/
          unzip -q /tmp/templates.tpz -d /tmp/templates/
          if [ -d "/tmp/templates/templates" ]; then
            mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/
          else
            mv /tmp/templates/* ~/.local/share/godot/export_templates/4.7.2.stable/
          fi
          echo "Templates installed"

      - name: Import assets (génère .godot/imported pour l'export)
        run: $GODOT --headless --import
        shell: bash

      - name: Export Web Build
        run: |
          mkdir -p build/web
          $GODOT --headless --export-release "Web" build/web/index.html
        shell: bash

      - name: Setup Pages
        uses: actions/configure-pages@v5
        # Active Pages automatiquement au premier déploiement (source :
        # GitHub Actions), inutile de le faire à la main dans les Settings
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4