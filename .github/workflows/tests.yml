name: Tests headless

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Godot 4.7.2
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          echo "GODOT=/tmp/Godot_v4.7.2-stable_linux.x86_64" >> $GITHUB_ENV

      - name: Import assets (génère .godot/imported, requis pour charger les scènes)
        run: $GODOT --headless --import

      - name: Check shaders (CODING_STANDARDS.md règle 1 — pas de « * COLOR »)
        run: |
          if grep -n '\* COLOR' assets/shaders/*.gdshader; then
            echo "::error::Un shader re-multiplie COLOR (cf. CODING_STANDARDS.md règle 1)"
            exit 1
          fi
          echo "OK : aucun « * COLOR »"

      - name: Run headless tests
        run: |
          # Chaque test est une scène qui se ferme elle-même avec un code
          # de sortie : 0 = tout passe, 1 = au moins une assertion en
          # échec. timeout 120 évite qu'un test bloqué fige le job.
          echec=0
          for test in tests/test_*.tscn; do
            echo "=== $test"
            if timeout 120 "$GODOT" --headless "$test" > /tmp/sortie_test.txt 2>&1; then
              if grep -q "RESULT: FAIL" /tmp/sortie_test.txt; then
                echo "::error::Échecs d'assertion dans $test"
                grep "FAIL" /tmp/sortie_test.txt
                echec=1
              fi
            else
              echo "::error::Crash ou timeout dans $test"
              tail -30 /tmp/sortie_test.txt
              echec=1
            fi
          done
          exit $echec
